<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>새생명축제 초대장 시안 · 2026 의정부비전교회 청년부</title>
<meta name="description" content="2026 의정부비전교회 청년부 새생명축제 모바일 초대장 9가지 컨셉 모음.">
<meta name="theme-color" content="#F4F1EC">
<meta property="og:type" content="website">
<meta property="og:site_name" content="의정부비전교회 청년부">
<meta property="og:title" content="2026 새생명축제 모바일 초대장 · 9가지 컨셉">
<meta property="og:description" content="10월 25일(주일) 오후 1시 50분 · 의정부비전교회. 마음에 드는 초대장을 골라 보세요.">
<meta property="og:image" content="https://uvision-ngen.github.io/2026-NewLifeFestival/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://uvision-ngen.github.io/2026-NewLifeFestival/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💌</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#F4F1EC;--card:#FFFFFF;--ink:#1F1D1A;--sub:#6E6A63;--line:#E4DED4;--accent:#E2574C}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:1120px;margin:0 auto;padding:48px 20px 64px}
.head{max-width:640px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--accent)}
h1{margin-top:10px;font-size:clamp(28px,6vw,40px);line-height:1.25;letter-spacing:-.03em;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.meta span{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13.5px}
.lede{margin-top:16px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:36px;list-style:none}
.card{display:flex;flex-direction:column;background:var(--card);border-radius:20px;overflow:hidden;border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(40,30,20,.10)}
.thumb{position:relative;display:block;aspect-ratio:390/520;overflow:hidden;background:#ddd}
.thumb img{width:100%;height:auto;display:block}
.num{position:absolute;left:12px;top:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.9);font-size:12px;font-weight:800;color:var(--ink)}
.body{display:flex;flex-direction:column;flex:1;padding:16px 18px 18px}
.body h2{font-size:18px;line-height:1.35;letter-spacing:-.02em}
.body p{margin-top:6px;font-size:14px;color:var(--sub);flex:1}
.slug{margin-top:12px;font-size:12.5px;color:var(--sub);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.acts{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}
.open{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.copy{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-size:13.5px}
.to-box{margin-top:28px;max-width:560px;padding:18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.to-box label{display:block;font-size:14px;font-weight:800}
.to-row{position:relative;margin-top:10px}
.to-row input{width:100%;height:52px;padding:0 44px 0 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font:inherit;font-size:16px;outline:none}
.to-row input:focus{border-color:var(--accent)}
.to-row button{position:absolute;right:6px;top:6px;width:40px;height:40px;font-size:22px;color:var(--sub)}
.to-box p{margin-top:8px;font-size:13px;color:var(--sub)}
.to-box p b{color:var(--accent)}
.tip{margin-top:40px;padding:22px 22px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.tip h3{font-size:16px}
.tip p{margin-top:6px;color:var(--sub);font-size:14px}
.tip code{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:8px;background:var(--bg);font-size:13px;word-break:break-all}
.foot{margin-top:40px;font-size:12.5px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);padding:11px 18px;border-radius:999px;background:rgba(31,29,26,.92);color:#fff;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <p class="eyebrow">2026 NEW LIFE FESTIVAL · INVITATION</p>
    <h1>새생명축제 모바일 초대장<br>9가지 컨셉</h1>
    <div class="meta"><span>10월 25일 주일 오후 1시 50분</span><span>의정부비전교회</span><span>의정부시 용민로122번길 50</span></div>
    <p class="lede">휴대폰으로 열어 보면 가장 정확해요. 마음에 드는 초대장의 링크를 복사해서 친구에게 보내 주세요.</p>
  </header>

  <section class="to-box">
    <label for="toName">받는 사람</label>
    <div class="to-row">
      <input id="toName" type="text" maxlength="12" autocomplete="off" placeholder="이름을 적으면 초대장에 들어가요 (예: 민수)">
      <button type="button" id="toClear" aria-label="이름 지우기" hidden>×</button>
    </div>
    <p id="toHint">이름을 비워 두면 누구에게나 보낼 수 있는 기본 링크가 복사돼요.</p>
  </section>

  <ul class="grid" id="grid"></ul>

  <p class="foot">© 2026 의정부비전교회 청년부 · 문의 박성진 강도사 010-5501-4328 / 이일규 장로 010-5746-1735</p>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
  const CONCEPTS = [
    ['retro', '레트로 픽셀 힐링 게임', '아바타를 움직여 픽셀 마을을 지나 교회까지 찾아가는 작은 게임. NPC가 위로와 일정을 알려 줘요.'],
    ['streaming', '스트리밍 플레이어', '다크 모드 음악 앱 화면. 가사 보기에는 초대 글귀가, 트랙 리스트에는 프로그램이 들어 있어요.'],
    ['test', '휴식 유형 심리테스트', '4개의 질문으로 알아보는 나의 휴식 유형과, 결과에 맞춘 주말 처방전 초대장.'],
    ['pass', '힙플 디지털 예약 패스', '성수동 팝업스토어 같은 미니멀 예약 페이지. 실시간 카운트다운과 나만의 입장 패스.'],
    ['vanilla', '바닐라 미니멀 & 코지', '크림색 여백과 커피 한 잔. 카페 메뉴판 식순과 커피 취향을 묻는 참석 신청.'],
    ['aurora', '모던 스테인드글라스와 빛', '어둠 속에 번지는 오로라와 스테인드글라스. 빛나는 별로 표시한 ‘빛을 따라오는 길’.'],
    ['kinfolk', '킨포크 스타일의 따뜻한 식탁', '잡지 같은 지면에 차려진 당신의 빈자리. 축의금 대신 ‘나눌 기도 제목’을 받아요.'],
    ['dawnsea', '새벽 바다와 나침반', '밤바다에서 새벽으로 밝아지는 스크롤. 나침반 바늘이 교회를 가리키며 멈춰요.'],
    ['letter', '감성 타이포그래피 편지', '봉인을 열면 시작되는 위로의 편지. 마태복음 11:28이 타자기처럼 써 내려가요.'],
  ];
  const base = location.origin + location.pathname.replace(/index\.html$/, '');
  const grid = document.getElementById('grid');
  CONCEPTS.forEach(([slug, title, desc], i) => {
    const li = document.createElement('li');
    li.className = 'card';
    li.innerHTML = `
      <a class="thumb" data-slug="${slug}" href="${slug}/"><img src="thumbs/${slug}.jpg" alt="" loading="lazy"><span class="num">${String(i + 1).padStart(2, '0')}</span></a>
      <div class="body">
        <h2></h2><p></p>
        <span class="slug">/${slug}/</span>
        <div class="acts"><a class="open" data-slug="${slug}" href="${slug}/">초대장 열기</a><button class="copy" type="button" data-url="${base}${slug}/">링크 복사</button></div>
      </div>`;
    li.querySelector('h2').textContent = title;
    li.querySelector('p').textContent = desc;
    li.querySelector('img').alt = `${title} 초대장 첫 화면`;
    grid.appendChild(li);
  });
  const toast = document.getElementById('toast');
  let t;
  const toInput = document.getElementById('toName');
  const toClear = document.getElementById('toClear');
  const toHint = document.getElementById('toHint');
  const DEFAULT_HINT = toHint.textContent;
  // 초대장(invite.js)이 받아들이는 형태로 정리: 특수문자 제거, 최대 12자
  const guestName = () => toInput.value.replace(/[<>&"'`]/g, '').trim().slice(0, 12);
  // 주소창·메신저에서 한글로 풀려 보이지 않도록 두 번 인코딩 (초대장에서 두 번 풀어 줌)
  const withName = (url) => (guestName() ? `${url}?to=${encodeURIComponent(encodeURIComponent(guestName()))}` : url);
  function syncName() {
    const name = guestName();
    toClear.hidden = !toInput.value;
    if (name) {
      toHint.textContent = '';
      const b = document.createElement('b');
      b.textContent = name;
      toHint.append(b, '님에게 보낼 링크가 복사돼요. 초대장 열기로 미리 볼 수 있어요.');
    } else {
      toHint.textContent = DEFAULT_HINT;
    }
    grid.querySelectorAll('a[data-slug]').forEach((a) => { a.href = withName(`${a.dataset.slug}/`); });
  }
  toInput.addEventListener('input', syncName);
  toClear.addEventListener('click', () => { toInput.value = ''; syncName(); toInput.focus(); });

  grid.addEventListener('click', async (e) => {
    const b = e.target.closest('.copy');
    if (!b) return;
    const url = withName(b.dataset.url);
    try { await navigator.clipboard.writeText(url); } catch {
      const ta = document.createElement('textarea'); ta.value = url; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch { /* 복사를 지원하지 않는 브라우저 */ }
      ta.remove();
    }
    toast.textContent = guestName() ? `${guestName()}님에게 보낼 링크를 복사했어요` : '링크를 복사했어요';
    toast.classList.add('on');
    clearTimeout(t);
    t = setTimeout(() => toast.classList.remove('on'), 2000);
  });
})();
</script>
</body>
</html>
